<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body { background: #f4f6f8; font-family: -apple-system, "Sukhumvit Set", "Noto Sans Thai", system-ui, sans-serif; display: grid; grid-template-columns: 833px 834px 833px; grid-template-rows: 843px 843px; }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; margin: 14px; background: #ffffff; border: 4px solid #e5e7eb; border-radius: 56px; }
  .tile.primary { background: #06c755; border-color: #06c755; }
  .icon { font-size: 230px; line-height: 1; }
  .en { font-size: 104px; font-weight: 800; color: #1f2933; letter-spacing: -1px; }
  .th { font-size: 76px; font-weight: 600; color: #6b7280; }
  .primary .en, .primary .th { color: #ffffff; }
</style>
</head>
<body>
  <div class="tile primary"><div class="icon">🔍</div><div class="en">Find events</div><div class="th">หาอะไรทำ</div></div>
  <div class="tile"><div class="icon">📅</div><div class="en">My bookings</div><div class="th">การจองของฉัน</div></div>
  <div class="tile"><div class="icon">🚕</div><div class="en">Get a ride</div><div class="th">เรียกรถไปงาน</div></div>
  <div class="tile"><div class="icon">🗓️</div><div class="en">Calendar</div><div class="th">ปฏิทิน</div></div>
  <div class="tile"><div class="icon">👤</div><div class="en">Profile</div><div class="th">โปรไฟล์</div></div>
  <div class="tile"><div class="icon">🌐</div><div class="en">Language</div><div class="th">ภาษา · 语言 · भाषा</div></div>
</body>
</html>
